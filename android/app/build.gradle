plugins {
    id 'com.android.application'
}

android {
    namespace 'id.co.suryakamangta.absensi'
    compileSdk 34

    defaultConfig {
        applicationId 'id.co.suryakamangta.absensi'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '1.2.0'
    }

    signingConfigs {
        release {
            def ks = System.getenv('SK_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SK_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SK_KEY_ALIAS')
                keyPassword System.getenv('SK_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('SK_KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // File server (PHP/.htaccess) tidak ikut ke dalam APK
    androidResources { ignoreAssetsPattern '!*.php:!.htaccess:!data' }

    // Web app (../web/index.html) ikut dibundel sebagai assets/index.html
    sourceSets {
        main { assets.srcDirs = ['src/main/assets', '../../web'] }
    }
}
