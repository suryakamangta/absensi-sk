name: Build APK Absensi SK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Buat ikon aplikasi
        run: |
          sudo apt-get install -y fonts-dejavu-core >/dev/null || true
          pip install pillow
          python tools/make_icons.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Siapkan keystore (opsional, dari secret)
        env:
          KS_B64: ${{ secrets.SK_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sk-release.jks"
            echo "SK_KEYSTORE_FILE=$RUNNER_TEMP/sk-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          SK_KEYSTORE_PASSWORD: ${{ secrets.SK_KEYSTORE_PASSWORD }}
          SK_KEY_ALIAS: ${{ secrets.SK_KEY_ALIAS }}
          SK_KEY_PASSWORD: ${{ secrets.SK_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AbsensiSK.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AbsensiSK-apk
          path: AbsensiSK.apk

      - name: Publish ke Release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Absensi SK (build terbaru)
          files: AbsensiSK.apk
          prerelease: false
          make_latest: true
